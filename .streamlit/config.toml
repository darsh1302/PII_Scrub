# Streamlit server configuration.
#
# maxUploadSize is a second, independent ceiling on top of the application's own
# demo cap. Streamlit's default is 200 MB, which on a shared host is enough to
# exhaust memory before the app ever sees the bytes.
[server]
maxUploadSize = 1
# XSRF protection requires CORS restrictions to work, so enableCORS is left at its
# default of true. Setting it false alongside XSRF protection is contradictory —
# Streamlit overrode it back and warned on every start.
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#4db6ac"
